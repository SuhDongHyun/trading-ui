<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,600&display=swap" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>코인 검색 목업</title>
    <!--
      Trading UI · 코인 검색 페이지 목업
      - 데이터: 백엔드 /bitcoin/* API 스냅샷(2026-10-28 23:35 KST)을 그대로 내장
      - 상세 데이터(캔들·호가·체결)는 KRW-BTC/ETH/XRP/SOL/DOGE만 실데이터, 그 외 코인은 티커 기준 생성 데이터
      - 토큰과 컴포넌트 스타일은 src/presentation/styles.css 와 맞춤
    -->
    <style>
      :root {
        color-scheme: light;

        --color-primary: #6366f1;
        --color-primary-hover: #4f46e5;
        --color-neutral: #9c9c9c;
        --color-background: #fafafa;
        --color-surface: #ffffff;
        --color-surface-muted: #f4f4f5;
        --color-surface-hover: #f7f7fa;
        --color-text-primary: #0a0a0a;
        --color-text-secondary: #6b6b6b;
        --color-text-muted: #8a8a91;
        --color-border: #e8e8ec;
        --color-border-strong: #d4d4dc;
        --color-success: #10b981;
        --color-warning: #f59e0b;
        --color-warning-surface: #fff7e6;
        --color-warning-text: #9a5b00;
        --color-error: #ef4444;
        --color-error-surface: #fff1f2;
        --color-error-border: #fecdd3;
        --color-error-text: #b4233b;
        --color-up: #d9284c;
        --color-down: #3574d4;
        --color-up-surface: rgb(217 40 76 / 8%);
        --color-down-surface: rgb(53 116 212 / 8%);
        --color-chart-teal: #1f9aa8;
        --color-chart-orange: #d66d51;
        --color-primary-surface: rgb(99 102 241 / 9%);
        --color-nav-backdrop: rgb(250 250 250 / 84%);

        --radius-small: 4px;
        --radius-control: 6px;
        --radius-panel: 8px;
        --radius-large: 12px;
        --radius-pill: 9999px;

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-8: 32px;

        --font-display: "General Sans", "DM Sans", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
        --font-body: "DM Sans", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
        --font-code: "JetBrains Mono", ui-monospace, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", monospace;
        --weight-regular: 400;
        --weight-semibold: 600;
        --ring-primary: 0 0 0 3px rgb(99 102 241 / 12%);
        --shadow-popover: 0 16px 40px rgb(24 24 27 / 14%);

        color: var(--color-text-primary);
        background: var(--color-background);
        font-family: var(--font-body);
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
        background: var(--color-background);
        color: var(--color-text-primary);
        font-family: var(--font-body);
        font-size: 14px;
        line-height: 1.5;
      }

      button,
      input,
      select {
        color: inherit;
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 0;
        border-color: var(--color-primary);
        box-shadow: 0 0 0 1px var(--color-primary), var(--ring-primary);
      }

      .num {
        font-family: var(--font-code);
        font-variant-numeric: tabular-nums;
      }

      .up {
        color: var(--color-up);
      }

      .down {
        color: var(--color-down);
      }

      .even {
        color: var(--color-text-secondary);
      }

      /* ---------- shell / nav (styles.css 와 동일) ---------- */

      .app-shell {
        min-height: 100vh;
        padding: 0 24px 40px;
      }

      .page-nav {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-4);
        width: min(1280px, 100%);
        min-height: 56px;
        margin: 0 auto 24px;
        padding: 0 20px;
        border-bottom: 1px solid var(--color-border);
        background: var(--color-nav-backdrop);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      .page-nav strong {
        display: block;
        font-family: var(--font-display);
        font-size: 16px;
        font-weight: var(--weight-semibold);
        letter-spacing: -0.03em;
        line-height: 1.2;
      }

      .page-nav .nav-sub {
        display: block;
        margin-top: var(--space-1);
        color: var(--color-text-secondary);
        font-size: 11px;
      }

      .nav-right {
        display: flex;
        align-items: center;
        gap: var(--space-3);
      }

      .page-tabs {
        display: flex;
        gap: var(--space-1);
        padding: var(--space-1);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-panel);
        background: var(--color-surface);
      }

      .page-tabs button {
        min-width: 96px;
        height: 32px;
        border: 0;
        border-radius: var(--radius-small);
        padding: 0 var(--space-3);
        background: transparent;
        color: var(--color-text-secondary);
        font-size: 13px;
        font-weight: var(--weight-semibold);
        transition: background-color 160ms ease, color 160ms ease;
      }

      .page-tabs button:hover {
        color: var(--color-primary);
      }

      .page-tabs .active {
        background: var(--color-primary-surface);
        color: var(--color-primary-hover);
      }

      .api-toggle {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        color: var(--color-text-secondary);
        font-size: 12px;
        font-weight: var(--weight-semibold);
        white-space: nowrap;
        cursor: pointer;
      }

      .api-toggle input {
        width: 16px;
        height: 16px;
        margin: 0;
        accent-color: var(--color-primary);
      }

      /* 목업 주석: 각 영역이 어떤 엔드포인트에서 오는지 표시 */
      .api-tag {
        display: inline-flex;
        align-items: center;
        gap: var(--space-1);
        border: 1px dashed var(--color-border-strong);
        border-radius: var(--radius-small);
        padding: 1px 6px;
        color: var(--color-text-muted);
        font-family: var(--font-code);
        font-size: 11px;
        white-space: nowrap;
      }

      body:not(.show-api) .api-tag {
        display: none;
      }

      /* ---------- layout ---------- */

      .trading-app {
        width: min(1280px, 100%);
        margin: 0 auto;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-large);
        background: var(--color-surface);
      }

      .coin-app {
        display: grid;
        grid-template-columns: 400px minmax(0, 1fr);
        overflow: hidden;
      }

      /* ---------- market list (좌측) ---------- */

      .coin-market {
        display: flex;
        flex-direction: column;
        min-width: 0;
        max-height: calc(100vh - 120px);
        min-height: 640px;
        border-right: 1px solid var(--color-border);
        background: var(--color-surface);
      }

      .coin-market-head {
        display: grid;
        gap: var(--space-3);
        padding: var(--space-4);
        border-bottom: 1px solid var(--color-border);
        background: var(--color-surface-muted);
      }

      .search-field {
        position: relative;
      }

      .search-field input {
        width: 100%;
        height: 38px;
        border: 1px solid var(--color-border-strong);
        border-radius: var(--radius-control);
        padding: 0 36px 0 34px;
        background: var(--color-surface);
        font-size: 14px;
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }

      .search-field input::placeholder {
        color: var(--color-neutral);
      }

      .search-field .search-icon {
        position: absolute;
        top: 50%;
        left: 11px;
        width: 15px;
        height: 15px;
        transform: translateY(-50%);
        color: var(--color-text-muted);
        pointer-events: none;
      }

      .search-field kbd {
        position: absolute;
        top: 50%;
        right: 8px;
        transform: translateY(-50%);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-small);
        padding: 0 6px;
        background: var(--color-surface-muted);
        color: var(--color-text-muted);
        font-family: var(--font-code);
        font-size: 11px;
      }

      .segmented {
        display: flex;
        gap: var(--space-1);
        padding: 3px;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-panel);
        background: var(--color-surface);
      }

      .segmented button {
        flex: 1;
        height: 30px;
        border: 0;
        border-radius: var(--radius-small);
        padding: 0 var(--space-2);
        background: transparent;
        color: var(--color-text-secondary);
        font-size: 13px;
        font-weight: var(--weight-semibold);
        white-space: nowrap;
        transition: background-color 160ms ease, color 160ms ease;
      }

      .segmented button:hover {
        color: var(--color-primary);
      }

      .segmented button.active {
        background: var(--color-primary-surface);
        color: var(--color-primary-hover);
      }

      .segmented button small {
        margin-left: var(--space-1);
        color: var(--color-text-muted);
        font-family: var(--font-code);
        font-size: 11px;
        font-weight: var(--weight-regular);
      }

      .market-head-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-2);
        color: var(--color-text-secondary);
        font-size: 12px;
      }

      .filter-check {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        cursor: pointer;
      }

      .filter-check input {
        width: 14px;
        height: 14px;
        margin: 0;
        accent-color: var(--color-primary);
      }

      .coin-row,
      .coin-list-header {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) 64px minmax(0, 0.8fr);
        gap: var(--space-2);
        align-items: center;
        padding: 0 var(--space-4);
      }

      .coin-list-header {
        min-height: 34px;
        border-bottom: 1px solid var(--color-border);
        background: var(--color-surface);
      }

      .coin-list-header button {
        border: 0;
        padding: 0;
        background: transparent;
        color: var(--color-text-muted);
        font-size: 12px;
        font-weight: var(--weight-semibold);
        text-align: right;
        white-space: nowrap;
      }

      .coin-list-header button:first-child {
        text-align: left;
      }

      .coin-list-header button:hover,
      .coin-list-header button.sorted {
        color: var(--color-primary-hover);
      }

      .coin-list {
        flex: 1;
        overflow-y: auto;
      }

      .coin-row {
        width: 100%;
        min-height: 54px;
        border: 0;
        border-bottom: 1px solid var(--color-border);
        background: var(--color-surface);
        text-align: right;
        transition: background-color 120ms ease;
      }

      .coin-row:hover {
        background: var(--color-surface-hover);
      }

      .coin-row.selected {
        background: var(--color-primary-surface);
        box-shadow: inset 3px 0 0 var(--color-primary);
      }

      .coin-name {
        display: grid;
        min-width: 0;
        text-align: left;
      }

      .coin-name b {
        display: flex;
        align-items: center;
        gap: var(--space-1);
        overflow: hidden;
        font-size: 13px;
        font-weight: var(--weight-semibold);
        white-space: nowrap;
      }

      .coin-name b span {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .coin-name small {
        color: var(--color-text-muted);
        font-family: var(--font-code);
        font-size: 11px;
      }

      .coin-row .num {
        font-size: 12px;
        font-weight: var(--weight-semibold);
        white-space: nowrap;
      }

      .coin-row .cell-stack {
        display: grid;
        line-height: 1.3;
      }

      .coin-row .cell-stack small {
        font-size: 11px;
        font-weight: var(--weight-regular);
      }

      .coin-row .amount {
        color: var(--color-text-secondary);
        font-weight: var(--weight-regular);
      }

      mark {
        border-radius: 2px;
        background: rgb(99 102 241 / 16%);
        color: inherit;
      }

      .list-empty {
        display: grid;
        gap: var(--space-1);
        padding: var(--space-8) var(--space-4);
        color: var(--color-text-secondary);
        text-align: center;
      }

      .list-empty strong {
        color: var(--color-text-primary);
      }

      .coin-market-foot {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-1);
        padding: var(--space-2) var(--space-4);
        border-top: 1px solid var(--color-border);
      }

      body:not(.show-api) .coin-market-foot {
        display: none;
      }

      /* ---------- chips ---------- */

      .chip {
        display: inline-flex;
        align-items: center;
        flex: none;
        border-radius: var(--radius-pill);
        padding: 1px 8px;
        font-size: 11px;
        font-weight: var(--weight-semibold);
        line-height: 18px;
        white-space: nowrap;
      }

      .chip.warn {
        border: 1px solid var(--color-error-border);
        background: var(--color-error-surface);
        color: var(--color-error-text);
      }

      .chip.caution {
        border: 1px solid #fde3b0;
        background: var(--color-warning-surface);
        color: var(--color-warning-text);
      }

      .chip.tiny {
        padding: 0 5px;
        font-size: 10px;
        line-height: 16px;
      }

      /* ---------- detail (우측) ---------- */

      .coin-detail {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .quote-header {
        padding: 24px 28px 20px;
      }

      .quote-topline,
      .quote-summary {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--space-5);
      }

      .quote-title-group {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        min-width: 0;
      }

      .coin-avatar {
        display: grid;
        flex: none;
        place-items: center;
        width: 40px;
        height: 40px;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-pill);
        background: var(--color-surface-muted);
        color: var(--color-text-secondary);
        font-family: var(--font-code);
        font-size: 12px;
        font-weight: var(--weight-semibold);
      }

      .quote-header h1 {
        margin: 0;
        font-family: var(--font-display);
        font-size: 32px;
        font-weight: var(--weight-semibold);
        letter-spacing: -0.04em;
        line-height: 1.15;
      }

      .quote-header .quote-sub {
        margin: var(--space-1) 0 0;
        color: var(--color-text-secondary);
        font-size: 13px;
      }

      .quote-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: var(--space-2);
      }

      .market-pill {
        border: 1px solid var(--color-border);
        border-radius: var(--radius-pill);
        padding: 6px 12px;
        background: var(--color-surface-muted);
        color: var(--color-text-secondary);
        font-size: 12px;
        font-weight: var(--weight-semibold);
      }

      .quote-summary {
        align-items: flex-end;
        margin-top: var(--space-5);
      }

      .price {
        display: block;
        font-family: var(--font-code);
        font-size: 38px;
        font-weight: var(--weight-semibold);
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.04em;
        line-height: 1.15;
      }

      .price small {
        margin-left: var(--space-1);
        color: var(--color-text-muted);
        font-size: 14px;
        letter-spacing: 0;
      }

      .diff {
        display: inline-block;
        margin-top: var(--space-1);
        font-family: var(--font-code);
        font-size: 14px;
        font-weight: var(--weight-semibold);
        font-variant-numeric: tabular-nums;
      }

      .quote-metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(96px, auto));
        gap: var(--space-3) var(--space-6);
        margin: 0;
        text-align: right;
      }

      .quote-metrics dt {
        color: var(--color-text-muted);
        font-size: 12px;
      }

      .quote-metrics dd {
        margin: 2px 0 0;
        font-family: var(--font-code);
        font-size: 13px;
        font-weight: var(--weight-semibold);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .range-row {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: var(--space-3);
        align-items: center;
        margin-top: var(--space-5);
        color: var(--color-text-secondary);
        font-size: 12px;
      }

      .range-row .range-end {
        display: grid;
        line-height: 1.3;
      }

      .range-row .range-end:last-child {
        text-align: right;
      }

      .range-row .range-end b {
        color: var(--color-text-primary);
        font-family: var(--font-code);
        font-size: 12px;
        font-weight: var(--weight-semibold);
      }

      .range-row .range-end small {
        color: var(--color-text-muted);
        font-size: 11px;
      }

      .range-track {
        position: relative;
        height: 6px;
        border-radius: var(--radius-pill);
        background: linear-gradient(90deg, var(--color-down-surface), var(--color-up-surface)), var(--color-surface-muted);
      }

      .range-track .range-label {
        position: absolute;
        bottom: 10px;
        transform: translateX(-50%);
        color: var(--color-text-muted);
        font-size: 11px;
        white-space: nowrap;
      }

      .range-marker {
        position: absolute;
        top: 50%;
        width: 12px;
        height: 12px;
        border: 2px solid var(--color-surface);
        border-radius: var(--radius-pill);
        background: var(--color-text-primary);
        box-shadow: 0 0 0 1px var(--color-border-strong);
        transform: translate(-50%, -50%);
      }

      .quote-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-2);
        margin-top: var(--space-4);
        color: var(--color-text-muted);
        font-size: 12px;
      }

      .tab-row {
        display: flex;
        align-items: center;
        gap: var(--space-6);
        min-height: 48px;
        overflow-x: auto;
        border-top: 1px solid var(--color-border);
        border-bottom: 1px solid var(--color-border);
        padding: 0 28px;
        color: var(--color-text-secondary);
        font-size: 14px;
        white-space: nowrap;
      }

      .tab-row button {
        align-self: stretch;
        border: 0;
        border-bottom: 2px solid transparent;
        padding: 0 2px;
        background: transparent;
        color: inherit;
        font-size: inherit;
        transition: border-color 160ms ease, color 160ms ease;
      }

      .tab-row button:hover {
        color: var(--color-text-primary);
      }

      .tab-row button.active {
        border-bottom-color: var(--color-primary);
        color: var(--color-text-primary);
        font-weight: var(--weight-semibold);
      }

      .panel {
        padding: var(--space-4) 28px var(--space-6);
      }

      .panel[hidden] {
        display: none;
      }

      .panel-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
        margin-bottom: var(--space-3);
      }

      .panel-toolbar .segmented {
        flex: none;
      }

      .panel-toolbar .segmented button {
        min-width: 52px;
      }

      .toolbar-group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-3);
      }

      .legend {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        color: var(--color-text-secondary);
        font-size: 12px;
      }

      .legend i {
        display: inline-block;
        width: 14px;
        height: 2px;
        margin-right: var(--space-1);
        vertical-align: middle;
      }

      .sample-note {
        margin: 0 0 var(--space-3);
        border: 1px solid #fde3b0;
        border-radius: var(--radius-panel);
        padding: var(--space-2) var(--space-3);
        background: var(--color-warning-surface);
        color: var(--color-warning-text);
        font-size: 12px;
      }

      /* chart */

      .chart-wrap {
        position: relative;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-panel);
        background: var(--color-surface);
      }

      .chart-wrap svg {
        display: block;
        width: 100%;
        height: 400px;
        user-select: none;
      }

      .chart-wrap svg text {
        font-family: var(--font-code);
        font-size: 11px;
      }

      .chart-tooltip {
        position: absolute;
        top: 10px;
        z-index: 2;
        display: none;
        min-width: 176px;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-panel);
        padding: var(--space-2) var(--space-3);
        background: rgb(255 255 255 / 96%);
        box-shadow: var(--shadow-popover);
        font-size: 12px;
        pointer-events: none;
      }

      .chart-tooltip strong {
        display: block;
        margin-bottom: var(--space-1);
        font-size: 12px;
      }

      .chart-tooltip dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px var(--space-3);
        margin: 0;
      }

      .chart-tooltip dt {
        color: var(--color-text-muted);
      }

      .chart-tooltip dd {
        margin: 0;
        font-family: var(--font-code);
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .period-stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: var(--space-3);
        margin: var(--space-4) 0 0;
      }

      .period-stats div {
        border: 1px solid var(--color-border);
        border-radius: var(--radius-panel);
        padding: var(--space-3);
      }

      .period-stats dt {
        color: var(--color-text-muted);
        font-size: 12px;
      }

      .period-stats dd {
        margin: var(--space-1) 0 0;
        font-family: var(--font-code);
        font-size: 14px;
        font-weight: var(--weight-semibold);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      /* orderbook */

      .ob-select {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        color: var(--color-text-secondary);
        font-size: 12px;
        font-weight: var(--weight-semibold);
      }

      .ob-select select {
        height: 32px;
        border: 1px solid var(--color-border-strong);
        border-radius: var(--radius-control);
        padding: 0 var(--space-2);
        background: var(--color-surface);
        font-size: 13px;
      }

      .ob-info {
        color: var(--color-text-secondary);
        font-size: 12px;
      }

      .ob-info b {
        color: var(--color-text-primary);
        font-family: var(--font-code);
        font-weight: var(--weight-semibold);
      }

      .ob-ratio {
        margin-bottom: var(--space-3);
      }

      .ob-ratio-bar {
        display: flex;
        height: 6px;
        overflow: hidden;
        border-radius: var(--radius-pill);
        background: var(--color-surface-muted);
      }

      .ob-ratio-bar .ask {
        background: var(--color-down);
      }

      .ob-ratio-bar .bid {
        background: var(--color-up);
      }

      .ob-ratio-labels {
        display: flex;
        justify-content: space-between;
        margin-top: var(--space-1);
        font-family: var(--font-code);
        font-size: 12px;
      }

      .orderbook {
        border: 1px solid var(--color-border);
        border-radius: var(--radius-panel);
        overflow: hidden;
      }

      .ob-row {
        display: grid;
        grid-template-columns: 1fr minmax(150px, 0.9fr) 1fr;
        min-height: 30px;
        border-bottom: 1px solid var(--color-surface);
        font-family: var(--font-code);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .ob-row:last-child {
        border-bottom: 0;
      }

      .ob-cell {
        position: relative;
        display: flex;
        align-items: center;
        padding: 0 var(--space-3);
      }

      .ob-cell .bar {
        position: absolute;
        top: 3px;
        bottom: 3px;
        border-radius: 2px;
      }

      .ob-cell span {
        position: relative;
      }

      .ob-row.ask .ob-cell.size {
        justify-content: flex-end;
        background: var(--color-down-surface);
      }

      .ob-row.ask .bar {
        right: 0;
        background: rgb(53 116 212 / 16%);
      }

      .ob-row.bid .ob-cell.size {
        background: var(--color-up-surface);
      }

      .ob-row.bid .bar {
        left: 0;
        background: rgb(217 40 76 / 16%);
      }

      .ob-cell.price-cell {
        justify-content: space-between;
        gap: var(--space-2);
        font-weight: var(--weight-semibold);
      }

      .ob-row.ask .price-cell {
        background: var(--color-down-surface);
      }

      .ob-row.bid .price-cell {
        background: var(--color-up-surface);
      }

      .ob-row.current .price-cell {
        box-shadow: inset 0 0 0 1px var(--color-text-primary);
      }

      .ob-cell.price-cell small {
        font-size: 11px;
        font-weight: var(--weight-regular);
      }

      .ob-spread {
        display: flex;
        justify-content: center;
        gap: var(--space-4);
        padding: var(--space-2);
        border-top: 1px solid var(--color-border);
        border-bottom: 1px solid var(--color-border);
        background: var(--color-surface-muted);
        color: var(--color-text-secondary);
        font-size: 12px;
      }

      .ob-spread b {
        color: var(--color-text-primary);
        font-family: var(--font-code);
      }

      /* trades */

      .data-table {
        width: 100%;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-panel);
        border-collapse: separate;
        border-spacing: 0;
        overflow: hidden;
        font-size: 13px;
      }

      .data-table th {
        height: 36px;
        border-bottom: 1px solid var(--color-border);
        padding: 0 var(--space-4);
        background: var(--color-surface-muted);
        color: var(--color-text-muted);
        font-size: 12px;
        font-weight: var(--weight-semibold);
        text-align: right;
      }

      .data-table td {
        height: 36px;
        border-bottom: 1px solid var(--color-border);
        padding: 0 var(--space-4);
        font-family: var(--font-code);
        font-variant-numeric: tabular-nums;
        text-align: right;
        white-space: nowrap;
      }

      .data-table tr:last-child td {
        border-bottom: 0;
      }

      .data-table tbody tr:hover td {
        background: var(--color-surface-hover);
      }

      .data-table th:first-child,
      .data-table td:first-child {
        text-align: left;
      }

      .side-badge {
        display: inline-block;
        min-width: 40px;
        border-radius: var(--radius-small);
        padding: 1px 6px;
        font-family: var(--font-body);
        font-size: 12px;
        font-weight: var(--weight-semibold);
        text-align: center;
      }

      .side-badge.bid {
        background: var(--color-up-surface);
        color: var(--color-up);
      }

      .side-badge.ask {
        background: var(--color-down-surface);
        color: var(--color-down);
      }

      .trade-summary {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-4);
        color: var(--color-text-secondary);
        font-size: 12px;
      }

      .trade-summary b {
        font-family: var(--font-code);
        font-weight: var(--weight-semibold);
      }

      /* ---------- responsive ---------- */

      @media (max-width: 1100px) {
        .coin-app {
          grid-template-columns: 340px minmax(0, 1fr);
        }

        .quote-summary {
          flex-direction: column;
          align-items: flex-start;
        }

        .quote-metrics {
          width: 100%;
          text-align: left;
        }
      }

      @media (max-width: 860px) {
        .app-shell {
          padding: 0 16px 32px;
        }

        .page-nav {
          flex-wrap: wrap;
          padding: var(--space-2) 0;
        }

        .nav-right {
          flex-wrap: wrap;
        }

        .page-tabs button {
          min-width: 0;
        }

        .coin-app {
          grid-template-columns: minmax(0, 1fr);
        }

        .coin-market {
          min-height: 0;
          max-height: 480px;
          border-right: 0;
          border-bottom: 1px solid var(--color-border);
        }

        .quote-header,
        .panel {
          padding-right: var(--space-4);
          padding-left: var(--space-4);
        }

        .tab-row {
          padding: 0 var(--space-4);
        }

        .quote-header h1 {
          font-size: 24px;
        }

        .price {
          font-size: 28px;
        }

        .quote-metrics,
        .period-stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .range-row {
          grid-template-columns: 1fr 1fr;
          row-gap: var(--space-2);
        }

        .range-track {
          grid-column: 1 / -1;
          grid-row: 2;
        }

        .ob-row {
          grid-template-columns: 1fr minmax(120px, 1fr) 1fr;
        }

        .data-table th,
        .data-table td {
          padding: 0 var(--space-2);
        }

        .data-table .hide-sm {
          display: none;
        }
      }
    </style>

            chosung: toChosung(ko),
            price: t[0], open: t[1], high: t[2], low: t[3], prevClose: t[4],
            change: t[5], rate: t[6], amount: t[7], volume: t[8],
            high52: t[9], high52Date: t[10], low52: t[11], low52Date: t[12], tradeAt: t[13],
          };
        });
      const coinByMarket = Object.fromEntries(coins.map((c) => [c.market, c]));

      const state = {
        quote: 'KRW',
        query: '',
        cautionOnly: false,
        sort: { key: 'amount', dir: -1 },
        market: 'KRW-BTC',
        tab: 'chart',
        period: 'D',
        level: '0',
        side: 'all',
        hover: null,
      };

      const hashMarket = decodeURIComponent(location.hash.slice(1));
      if (coinByMarket[hashMarket]) {
        state.market = hashMarket;
        state.quote = coinByMarket[hashMarket].quote;
      }

      /* ---------- format ---------- */

      function decimalsFor(price, quote) {
        if (quote === 'BTC') return 8;
        const abs = Math.abs(price);
        if (quote === 'USDT') return abs >= 100 ? 2 : abs >= 1 ? 3 : abs >= 0.01 ? 5 : 8;
        return abs >= 100 ? 0 : abs >= 1 ? 2 : abs >= 0.01 ? 4 : 6;
      }

      function fmt(value, digits = 0) {
        return value.toLocaleString('ko-KR', { minimumFractionDigits: digits, maximumFractionDigits: digits });
      }

      function fmtPrice(price, quote) {
        return fmt(price, decimalsFor(price, quote));
      }

      function fmtSignedPrice(value, quote) {
        const text = fmtPrice(Math.abs(value), quote);
        return value > 0 ? `+${text}` : value < 0 ? `-${text}` : text;
      }

      function fmtRate(rate) {
        const pct = rate * 100;
        return `${pct > 0 ? '+' : ''}${pct.toFixed(2)}%`;
      }

      function fmtAmount(value, quote) {
        if (quote === 'KRW') {
          if (value >= 1e12) return `${fmt(value / 1e12, 2)}조`;
          if (value >= 1e8) return `${fmt(Math.round(value / 1e8))}억`;
          return `${fmt(Math.round(value / 1e6))}백만`;
        }
        if (quote === 'BTC') return `${fmt(value, value >= 10 ? 2 : 3)}`;
        return new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 }).format(value);
      }

      function fmtVolume(value) {
        const abs = Math.abs(value);
        const digits = abs >= 1e6 ? 0 : abs >= 1000 ? 2 : abs >= 1 ? 4 : 8;
        return fmt(value, digits);
      }

      function dirClass(value) {
        return value > 0 ? 'up' : value < 0 ? 'down' : 'even';
      }

      function escapeHtml(text) {
        return text.replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
      }

      /* ---------- search ---------- */

      function toChosung(text) {
        return [...text]
          .map((ch) => {
            const code = ch.charCodeAt(0) - 0xac00;
            return code >= 0 && code < 11172 ? CHOSUNG[Math.floor(code / 588)] : ch;
          })
          .join('');
      }

      function normalize(text) {
        return text.toLowerCase().replace(/\s+/g, '');
      }

      function isChosungQuery(q) {
        return q.length > 0 && [...q].every((ch) => CHOSUNG.includes(ch));
      }

      function matches(coin, rawQuery) {
        const q = normalize(rawQuery);
        if (!q) return true;
        if (isChosungQuery(q)) return normalize(coin.chosung).includes(q);
        return (
          normalize(coin.ko).includes(q) ||
          normalize(coin.en).includes(q) ||
          coin.symbol.toLowerCase().includes(q) ||
          coin.market.toLowerCase().includes(q)
        );
      }

      function highlight(text, rawQuery) {
        const q = rawQuery.trim();
        if (!q || isChosungQuery(normalize(q))) return escapeHtml(text);
        const idx = text.toLowerCase().indexOf(q.toLowerCase());
        if (idx < 0) return escapeHtml(text);
        return `${escapeHtml(text.slice(0, idx))}<mark>${escapeHtml(text.slice(idx, idx + q.length))}</mark>${escapeHtml(text.slice(idx + q.length))}`;
      }

      function visibleCoins(quote) {
        return coins.filter(
          (c) => c.quote === quote && matches(c, state.query) && (!state.cautionOnly || c.warning || c.cautions.length),
        );
      }

      /* ---------- list ---------- */

      function renderQuoteTabs() {
        const el = document.getElementById('quoteTabs');
        el.innerHTML = QUOTES.map((q) => {
          const count = visibleCoins(q).length;
          return `<button type="button" role="tab" data-quote="${q}" class="${q === state.quote ? 'active' : ''}" aria-selected="${q === state.quote}">${q}<small>${count}</small></button>`;
        }).join('');
      }

      function renderList() {
        const list = visibleCoins(state.quote);
        const { key, dir } = state.sort;
        list.sort((a, b) => {
          if (key === 'name') return dir * a.ko.localeCompare(b.ko, 'ko');
          return dir * (a[key] - b[key]);
        });

        document.getElementById('listCount').textContent = state.query
          ? `"${state.query}" 검색 결과 ${list.length}개`
          : `${state.quote} 마켓 ${list.length}개`;

        document.querySelectorAll('#listHeader button').forEach((btn) => {
          const sorted = btn.dataset.sort === key;
          btn.classList.toggle('sorted', sorted);
          btn.textContent = btn.textContent.replace(/ [▲▼]$/, '') + (sorted ? (dir > 0 ? ' ▲' : ' ▼') : '');
        });

        const el = document.getElementById('coinList');
        if (!list.length) {
          el.innerHTML = `<div class="list-empty"><strong>일치하는 코인이 없습니다</strong><span>다른 마켓 탭이나 영문 심볼로 검색해 보세요.</span></div>`;
          return;
        }

        el.innerHTML = list
          .map((c) => {
            const cls = dirClass(c.change);
            const flag = c.warning
              ? '<span class="chip warn tiny">유의</span>'
              : c.cautions.length
                ? '<span class="chip caution tiny">주의</span>'
                : '';
            return `<button type="button" role="option" class="coin-row${c.market === state.market ? ' selected' : ''}" data-market="${c.market}" aria-selected="${c.market === state.market}">
              <span class="coin-name">
                <b><span>${highlight(c.ko, state.query)}</span>${flag}</b>
                <small>${highlight(c.symbol, state.query)}/${c.quote}</small>
              </span>
              <span class="num ${cls}">${fmtPrice(c.price, c.quote)}</span>
              <span class="num cell-stack ${cls}">${fmtRate(c.rate)}<small>${fmtSignedPrice(c.change, c.quote)}</small></span>
              <span class="num amount">${fmtAmount(c.amount, c.quote)}</span>
            </button>`;
          })
          .join('');
      }

      /* ---------- detail header ---------- */

      function renderHeader() {
        const c = coinByMarket[state.market];
        const cls = dirClass(c.change);
        const arrow = c.change > 0 ? '▲' : c.change < 0 ? '▼' : '–';
        const chips = [
          c.warning ? '<span class="chip warn" title="market_event.warning">투자유의</span>' : '',
          ...c.cautions.map((k) => `<span class="chip caution" title="market_event.caution.${k}">주의 · ${CAUTION_LABELS[k]}</span>`),
        ].join('');
        const span = c.high52 - c.low52 || 1;
        const pos = Math.min(100, Math.max(0, ((c.price - c.low52) / span) * 100));
        const ts = c.tradeAt;
        const tradeAt = `${ts.slice(0, 4)}.${ts.slice(4, 6)}.${ts.slice(6, 8)} ${ts.slice(8, 10)}:${ts.slice(10, 12)}:${ts.slice(12, 14)}`;

        document.getElementById('quoteHeader').innerHTML = `
          <div class="quote-topline">
            <div class="quote-title-group">
              <span class="coin-avatar" aria-hidden="true">${escapeHtml(c.symbol.slice(0, 4))}</span>
              <div>
                <h1>${escapeHtml(c.ko)}</h1>
                <p class="quote-sub">${c.market} | ${escapeHtml(c.en)} | ${c.quote} 마켓</p>
              </div>
            </div>
            <div class="quote-actions">${chips}<span class="market-pill">${c.quote}</span></div>
          </div>
          <div class="quote-summary">
            <div>
              <strong class="price ${cls}">${fmtPrice(c.price, c.quote)}<small>${c.quote}</small></strong>
              <span class="diff ${cls}">${arrow} ${fmtSignedPrice(c.change, c.quote)} ${fmtRate(c.rate)}</span>
            </div>
            <dl class="quote-metrics">
              <div><dt>고가</dt><dd class="up">${fmtPrice(c.high, c.quote)}</dd></div>
              <div><dt>저가</dt><dd class="down">${fmtPrice(c.low, c.quote)}</dd></div>
              <div><dt>전일종가</dt><dd>${fmtPrice(c.prevClose, c.quote)}</dd></div>
              <div><dt>24h 거래대금</dt><dd>${fmtAmount(c.amount, c.quote)} ${c.quote === 'KRW' ? '' : c.quote}</dd></div>
              <div><dt>24h 거래량</dt><dd>${fmtVolume(c.volume)} ${escapeHtml(c.symbol)}</dd></div>
              <div><dt>시가</dt><dd>${fmtPrice(c.open, c.quote)}</dd></div>
            </dl>
          </div>
          <div class="range-row" aria-label="52주 가격 범위">
            <span class="range-end"><small>52주 최저 · ${c.low52Date}</small><b>${fmtPrice(c.low52, c.quote)}</b></span>
            <div class="range-track">
              <span class="range-marker" style="left:${pos}%" title="현재가 위치 ${pos.toFixed(0)}%"></span>
            </div>
            <span class="range-end"><small>52주 최고 · ${c.high52Date}</small><b>${fmtPrice(c.high52, c.quote)}</b></span>
          </div>
          <div class="quote-meta">
            <span>최근 체결 ${tradeAt} KST</span>
            <span class="api-tag">POST /bitcoin/ticker {markets:["${c.market}"]}</span>
          </div>`;
      }

      /* ---------- mock data for coins outside the snapshot ---------- */

      function seeded(text) {
        let h = 1779033703 ^ text.length;
        for (const ch of text) h = Math.imul(h ^ ch.charCodeAt(0), 3432918353);
        return () => {
          h = Math.imul(h ^ (h >>> 16), 2246822507);
          h = Math.imul(h ^ (h >>> 13), 3266489909);
          return ((h ^= h >>> 16) >>> 0) / 4294967296;
        };
      }

      function tickFor(price, quote) {
        if (quote === 'BTC') return 1e-8;
        const exp = Math.floor(Math.log10(Math.max(price, 1e-8)));
        const tick = 10 ** (exp - 3);
        return quote === 'KRW' && price >= 1000 ? Math.max(1, tick) : tick;
      }

      function roundTo(value, tick) {
        return Math.round(value / tick) * tick;
      }

      const PERIOD_MS = { m15: 9e5, m60: 36e5, D: 864e5, W: 6048e5, M: 2592e6 };

      function syntheticCandles(c, periodKey) {
        const period = PERIODS.find((p) => p.key === periodKey);
        const rand = seeded(c.market + periodKey);
        const n = 80;
        const tick = tickFor(c.price, c.quote);
        const end = new Date(2026, 9, 28, 23, 0).getTime();
        const out = [];
        let close = c.price;
        for (let i = 0; i < n; i += 1) {
          const open = close * (1 + (rand() - 0.5) * period.vol * 2);
          const high = Math.max(open, close) * (1 + rand() * period.vol * 0.7);
          const low = Math.min(open, close) * (1 - rand() * period.vol * 0.7);
          const t = new Date(end - i * PERIOD_MS[periodKey]);
          const iso = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}T${String(t.getHours()).padStart(2, '0')}:00:00`;
          const volume = (c.volume / (864e5 / PERIOD_MS[periodKey])) * (0.4 + rand() * 1.2);
          out.push([iso, roundTo(open, tick), roundTo(high, tick), roundTo(low, tick), roundTo(close, tick), volume]);
          close = open;
        }
        return out.reverse();
      }

      function syntheticOrderbook(c) {
        const rand = seeded(c.market + 'ob');
        const tick = tickFor(c.price, c.quote);
        const units = [];
        const base = c.volume / 2000;
        for (let i = 0; i < 15; i += 1) {
          units.push([c.price + tick * (i + 1), base * (0.1 + rand() * 2), c.price - tick * i, base * (0.1 + rand() * 2)]);
        }
        const ta = units.reduce((s, u) => s + u[1], 0);
        const tb = units.reduce((s, u) => s + u[3], 0);
        return { ta, tb, u: units };
      }

      function syntheticTrades(c) {
        const rand = seeded(c.market + 'tr');
        const tick = tickFor(c.price, c.quote);
        const out = [];
        let sec = 14 * 3600 + 34 * 60 + 58;
        for (let i = 0; i < 30; i += 1) {
          const h = Math.floor(sec / 3600);
          const m = Math.floor((sec % 3600) / 60);
          const s = sec % 60;
          const time = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
          out.push([time, c.price + tick * Math.round((rand() - 0.5) * 4), (c.volume / 5000) * rand() * 3, rand() > 0.5 ? 'BID' : 'ASK']);
          sec -= Math.floor(rand() * 20);
        }
        return out;
      }

      function hasSnapshot(market) {
        return Boolean(DATA.candles[market]);
      }

      function sampleNote(el, market) {
        el.hidden = hasSnapshot(market);
        el.textContent = `목업: ${market}은 스냅샷에 상세 데이터가 없어 티커 기준으로 생성한 값을 표시합니다. (실데이터: ${Object.keys(DATA.candles).join(', ')})`;
      }

      /* ---------- chart ---------- */

      function candlesFor(market, period) {
        return hasSnapshot(market) ? DATA.candles[market][period] : syntheticCandles(coinByMarket[market], period);
      }

      function movingAverage(closes, size) {
        return closes.map((_, i) => {
          if (i < size - 1) return null;
          let sum = 0;
          for (let k = i - size + 1; k <= i; k += 1) sum += closes[k];
          return sum / size;
        });
      }

      function niceStep(range, count) {
        const raw = range / count;
        const mag = 10 ** Math.floor(Math.log10(raw));
        const norm = raw / mag;
        return (norm >= 5 ? 10 : norm >= 2 ? 5 : norm >= 1 ? 2 : 1) * mag;
      }

      function axisLabel(iso, period, prevIso) {
        const [date, time] = iso.split('T');
        const [y, m, d] = date.split('-');
        if (period === 'm15' || period === 'm60') {
          return !prevIso || prevIso.slice(0, 10) !== date ? `${m}.${d}` : time.slice(0, 5);
        }
        if (period === 'D') return `${m}.${d}`;
        if (period === 'W') return `${y.slice(2)}.${m}.${d}`;
        return `${y}.${m}`;
      }

      function tooltipDate(iso, period) {
        const [date, time] = iso.split('T');
        const base = date.replaceAll('-', '.');
        if (period === 'm15' || period === 'm60') return `${base} ${time.slice(0, 5)}`;
        if (period === 'W') return `${base} 주`;
        if (period === 'M') return base.slice(0, 7);
        return base;
      }

      function renderChart() {
        const c = coinByMarket[state.market];
        const period = PERIODS.find((p) => p.key === state.period);
        document.getElementById('periodTabs').innerHTML = PERIODS.map(
          (p) => `<button type="button" data-period="${p.key}" class="${p.key === state.period ? 'active' : ''}">${p.label}</button>`,
        ).join('');
        document.getElementById('chartApi').textContent = `${period.api} {count:${state.period === 'D' ? 90 : state.period === 'M' ? 60 : 80}}`;
        sampleNote(document.getElementById('chartNote'), c.market);

        const candles = candlesFor(c.market, state.period);
        const svg = document.getElementById('chartSvg');
        const width = svg.clientWidth || 800;
        const height = 400;
        const pad = { top: 16, right: 84, bottom: 26, left: 8 };
        const plotW = width - pad.left - pad.right;
        const priceH = (height - pad.top - pad.bottom) * 0.74;
        const volTop = pad.top + priceH + 14;
        const volH = height - pad.bottom - volTop;

        const n = candles.length;
        const slot = plotW / n;
        const bodyW = Math.max(1, Math.min(14, slot * 0.64));
        const lows = candles.map((k) => k[3]);
        const highs = candles.map((k) => k[2]);
        let min = Math.min(...lows);
        let max = Math.max(...highs);
        const padY = (max - min) * 0.06 || max * 0.01;
        min -= padY;
        max += padY;
        const maxVol = Math.max(...candles.map((k) => k[5])) || 1;
        const y = (v) => pad.top + ((max - v) / (max - min)) * priceH;
        const x = (i) => pad.left + slot * i + slot / 2;
        const vy = (v) => volTop + volH - (v / maxVol) * volH;

        const parts = [];
        const step = niceStep(max - min, 5);
        const lastY = y(candles[n - 1][4]);
        for (let v = Math.ceil(min / step) * step; v <= max; v += step) {
          parts.push(`<line x1="${pad.left}" x2="${pad.left + plotW}" y1="${y(v)}" y2="${y(v)}" stroke="${PAL.border}" />`);
          // 현재가 태그와 겹치는 눈금 라벨은 생략
          if (Math.abs(y(v) - lastY) > 16) {
            parts.push(`<text x="${pad.left + plotW + 8}" y="${y(v) + 4}" fill="${PAL.textMuted}">${fmtPrice(v, c.quote)}</text>`);
          }
        }
        parts.push(`<line x1="${pad.left}" x2="${pad.left + plotW}" y1="${volTop - 7}" y2="${volTop - 7}" stroke="${PAL.border}" />`);
        parts.push(`<text x="${pad.left + plotW + 8}" y="${volTop + 8}" fill="${PAL.textMuted}">거래량</text>`);

        const labelEvery = Math.max(1, Math.ceil(n / Math.max(3, Math.floor(plotW / 96))));
        for (let i = n - 1; i >= 0; i -= labelEvery) {
          parts.push(
            `<text x="${x(i)}" y="${height - 8}" fill="${PAL.textMuted}" text-anchor="middle">${axisLabel(candles[i][0], state.period, candles[i - 1]?.[0])}</text>`,
          );
        }

        candles.forEach(([, o, h, l, cl, v], i) => {
          const color = cl >= o ? PAL.up : PAL.down;
          const top = y(Math.max(o, cl));
          const bodyH = Math.max(1, Math.abs(y(o) - y(cl)));
          parts.push(`<line x1="${x(i)}" x2="${x(i)}" y1="${y(h)}" y2="${y(l)}" stroke="${color}" />`);
          parts.push(`<rect x="${x(i) - bodyW / 2}" y="${top}" width="${bodyW}" height="${bodyH}" fill="${color}" />`);
          parts.push(`<rect x="${x(i) - bodyW / 2}" y="${vy(v)}" width="${bodyW}" height="${volTop + volH - vy(v)}" fill="${color}" opacity="0.38" />`);
        });

        const closes = candles.map((k) => k[4]);
        [
          [5, PAL.teal],
          [20, PAL.orange],
        ].forEach(([size, color]) => {
          const ma = movingAverage(closes, size);
          const d = ma
            .map((v, i) => (v === null ? null : `${x(i).toFixed(1)},${y(v).toFixed(1)}`))
            .filter(Boolean)
            .join(' L');
          if (d) parts.push(`<path d="M${d}" fill="none" stroke="${color}" stroke-width="1.5" />`);
        });

        const last = candles[n - 1];
        const lastColor = last[4] >= last[1] ? PAL.up : PAL.down;
        const ly = y(last[4]);
        parts.push(`<line x1="${pad.left}" x2="${pad.left + plotW}" y1="${ly}" y2="${ly}" stroke="${lastColor}" stroke-dasharray="3 3" />`);
        parts.push(`<rect x="${pad.left + plotW + 2}" y="${ly - 10}" width="${pad.right - 4}" height="20" rx="4" fill="${lastColor}" />`);
        parts.push(`<text x="${pad.left + plotW + 8}" y="${ly + 4}" fill="${PAL.surface}">${fmtPrice(last[4], c.quote)}</text>`);

        if (state.hover !== null && state.hover < n) {
          const hx = x(state.hover);
          parts.push(`<line x1="${hx}" x2="${hx}" y1="${pad.top}" y2="${volTop + volH}" stroke="${PAL.borderStrong}" />`);
        }
        parts.push(`<rect id="chartHit" x="${pad.left}" y="${pad.top}" width="${plotW}" height="${volTop + volH - pad.top}" fill="transparent" />`);

        svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
        svg.innerHTML = parts.join('');

        const tip = document.getElementById('chartTooltip');
        if (state.hover !== null && state.hover < n) {
          const [iso, o, h, l, cl, v] = candles[state.hover];
          const prev = candles[state.hover - 1]?.[4] ?? o;
          const rate = (cl - prev) / prev;
          tip.innerHTML = `<strong>${tooltipDate(iso, state.period)}</strong><dl>
            <dt>시가</dt><dd>${fmtPrice(o, c.quote)}</dd>
            <dt>고가</dt><dd class="up">${fmtPrice(h, c.quote)}</dd>
            <dt>저가</dt><dd class="down">${fmtPrice(l, c.quote)}</dd>
            <dt>종가</dt><dd class="${dirClass(rate)}">${fmtPrice(cl, c.quote)} (${fmtRate(rate)})</dd>
            <dt>거래량</dt><dd>${fmtVolume(v)}</dd></dl>`;
          tip.style.display = 'block';
          const left = x(state.hover) > width / 2 ? 12 : width - pad.right - 188;
          tip.style.left = `${left}px`;
        } else {
          tip.style.display = 'none';
        }

        document.getElementById('chartHit').addEventListener('mousemove', (event) => {
          const rect = svg.getBoundingClientRect();
          const px = ((event.clientX - rect.left) / rect.width) * width;
          const idx = Math.min(n - 1, Math.max(0, Math.floor((px - pad.left) / slot)));
          if (idx !== state.hover) {
            state.hover = idx;
            renderChart();
          }
        });
        document.getElementById('chartHit').addEventListener('mouseleave', () => {
          state.hover = null;
          renderChart();
        });

        const first = candles[0];
        const pHigh = Math.max(...highs);
        const pLow = Math.min(...lows);
        const pRate = (last[4] - first[1]) / first[1];
        const totalVol = candles.reduce((s, k) => s + k[5], 0);
        document.getElementById('periodStats').innerHTML = `
          <div><dt>기간 최고가</dt><dd class="up">${fmtPrice(pHigh, c.quote)}</dd></div>
          <div><dt>기간 최저가</dt><dd class="down">${fmtPrice(pLow, c.quote)}</dd></div>
          <div><dt>기간 수익률 (${n}봉)</dt><dd class="${dirClass(pRate)}">${fmtRate(pRate)}</dd></div>
          <div><dt>누적 거래량</dt><dd>${fmtVolume(totalVol)} ${escapeHtml(c.symbol)}</dd></div>`;
      }

      /* ---------- orderbook ---------- */

      function instrumentFor(c) {
        if (DATA.instruments[c.market]) return DATA.instruments[c.market];
        const tick = tickFor(c.price, c.quote);
        return [String(tick), ['0', String(tick * 10), String(tick * 100)]];
      }

      function aggregate(units, level) {
        if (!level) return units;
        const asks = new Map();
        const bids = new Map();
        units.forEach(([ap, as, bp, bs]) => {
          const ak = Math.ceil(ap / level) * level;
          const bk = Math.floor(bp / level) * level;
          asks.set(ak, (asks.get(ak) || 0) + as);
          bids.set(bk, (bids.get(bk) || 0) + bs);
        });
        const a = [...asks].sort((x, y) => x[0] - y[0]);
        const b = [...bids].sort((x, y) => y[0] - x[0]);
        return Array.from({ length: Math.max(a.length, b.length) }, (_, i) => [a[i]?.[0], a[i]?.[1], b[i]?.[0], b[i]?.[1]]);
      }

      function renderOrderbook() {
        const c = coinByMarket[state.market];
        const [tick, levels] = instrumentFor(c);
        if (!levels.includes(state.level)) state.level = '0';
        document.getElementById('levelSelect').innerHTML = levels
          .map((lv) => `<option value="${lv}" ${lv === state.level ? 'selected' : ''}>${lv === '0' ? '기본 (호가 단위)' : `${fmtPrice(Number(lv), c.quote)} 단위`}</option>`)
          .join('');
        document.getElementById('tickInfo').innerHTML = `호가 단위 <b>${fmtPrice(Number(tick), c.quote)}</b> ${c.quote}`;
        sampleNote(document.getElementById('obNote'), c.market);

        const book = DATA.orderbook[c.market] || syntheticOrderbook(c);
        const units = aggregate(book.u, Number(state.level));
        const askTotal = book.ta;
        const bidTotal = book.tb;
        const askPct = (askTotal / (askTotal + bidTotal)) * 100;
        document.getElementById('obRatio').innerHTML = `
          <div class="ob-ratio-bar"><span class="ask" style="width:${askPct}%"></span><span class="bid" style="width:${100 - askPct}%"></span></div>
          <div class="ob-ratio-labels"><span class="down">매도 잔량 ${fmtVolume(askTotal)} (${askPct.toFixed(1)}%)</span><span class="up">매수 잔량 ${fmtVolume(bidTotal)} (${(100 - askPct).toFixed(1)}%)</span></div>`;

        const maxSize = Math.max(...units.flatMap((u) => [u[1] || 0, u[3] || 0])) || 1;
        const pctFromPrev = (p) => fmtRate((p - c.prevClose) / c.prevClose);
        const asks = units
          .filter((u) => u[0] !== undefined)
          .slice()
          .reverse()
          .map(
            ([p, s]) => `<div class="ob-row ask${p === c.price ? ' current' : ''}">
              <div class="ob-cell size"><span class="bar" style="width:${(s / maxSize) * 100}%"></span><span>${fmtVolume(s)}</span></div>
              <div class="ob-cell price-cell ${dirClass(p - c.prevClose)}"><span>${fmtPrice(p, c.quote)}</span><small>${pctFromPrev(p)}</small></div>
              <div class="ob-cell"></div>
            </div>`,
          );
        const bids = units
          .filter((u) => u[2] !== undefined)
          .map(
            ([, , p, s]) => `<div class="ob-row bid${p === c.price ? ' current' : ''}">
              <div class="ob-cell"></div>
              <div class="ob-cell price-cell ${dirClass(p - c.prevClose)}"><span>${fmtPrice(p, c.quote)}</span><small>${pctFromPrev(p)}</small></div>
              <div class="ob-cell size"><span class="bar" style="width:${(s / maxSize) * 100}%"></span><span>${fmtVolume(s)}</span></div>
            </div>`,
          );
        const bestAsk = book.u[0][0];
        const bestBid = book.u[0][2];
        const spread = `<div class="ob-spread"><span>현재가 <b class="${dirClass(c.change)}">${fmtPrice(c.price, c.quote)}</b></span><span>스프레드 <b>${fmtPrice(bestAsk - bestBid, c.quote)}</b> (${(((bestAsk - bestBid) / bestBid) * 100).toFixed(3)}%)</span></div>`;
        document.getElementById('orderbook').innerHTML = asks.join('') + spread + bids.join('');
      }

      /* ---------- trades ---------- */

      function toKst(timeUtc) {
        const [h, m, s] = timeUtc.split(':').map(Number);
        return `${String((h + 9) % 24).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      function renderTrades() {
        const c = coinByMarket[state.market];
        sampleNote(document.getElementById('tradeNote'), c.market);
        const all = DATA.trades[c.market] || syntheticTrades(c);
        const rows = state.side === 'all' ? all : all.filter((t) => t[3] === state.side);
        const bidVol = all.filter((t) => t[3] === 'BID').reduce((s, t) => s + t[2], 0);
        const askVol = all.filter((t) => t[3] === 'ASK').reduce((s, t) => s + t[2], 0);
        document.getElementById('tradeSummary').innerHTML = `
          <span>최근 ${all.length}건</span>
          <span>매수 <b class="up">${fmtVolume(bidVol)}</b></span>
          <span>매도 <b class="down">${fmtVolume(askVol)}</b></span>`;
        document.querySelectorAll('#sideTabs button').forEach((b) => b.classList.toggle('active', b.dataset.side === state.side));
        document.getElementById('tradeRows').innerHTML = rows.length
          ? rows
              .map(([time, price, vol, side]) => {
                const diff = price - c.prevClose;
                return `<tr>
                  <td>${toKst(time)}</td>
                  <td><span class="side-badge ${side === 'BID' ? 'bid' : 'ask'}">${side === 'BID' ? '매수' : '매도'}</span></td>
                  <td class="${dirClass(diff)}">${fmtPrice(price, c.quote)}</td>
                  <td>${fmtVolume(vol)}</td>
                  <td class="hide-sm">${c.quote === 'KRW' ? fmt(Math.round(price * vol)) : fmtVolume(price * vol)}</td>
                  <td class="hide-sm ${dirClass(diff)}">${fmtRate(diff / c.prevClose)}</td>
                </tr>`;
              })
              .join('')
          : `<tr><td colspan="6" style="text-align:center;color:var(--color-text-secondary)">해당 구분의 체결이 없습니다</td></tr>`;
      }

      /* ---------- wiring ---------- */

      function renderDetail() {
        renderHeader();
        document.querySelectorAll('#detailTabs button').forEach((b) => b.classList.toggle('active', b.dataset.tab === state.tab));
        ['chart', 'orderbook', 'trades'].forEach((tab) => {
          document.getElementById(`panel-${tab}`).hidden = tab !== state.tab;
        });
        if (state.tab === 'chart') renderChart();
        if (state.tab === 'orderbook') renderOrderbook();
        if (state.tab === 'trades') renderTrades();
      }

      function renderAll() {
        renderQuoteTabs();
        renderList();
        renderDetail();
      }

      document.getElementById('coinSearch').addEventListener('input', (event) => {
        state.query = event.target.value;
        // 현재 탭에 결과가 없고 다른 마켓에 있으면 그 마켓으로 이동
        if (!visibleCoins(state.quote).length) {
          const other = QUOTES.find((q) => visibleCoins(q).length);
          if (other) state.quote = other;
        }
        renderQuoteTabs();
        renderList();
      });

      document.getElementById('coinSearch').addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          const first = document.querySelector('#coinList .coin-row');
          if (first) first.click();
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === '/' && document.activeElement?.tagName !== 'INPUT') {
          event.preventDefault();
          document.getElementById('coinSearch').focus();
        }
      });

      document.getElementById('quoteTabs').addEventListener('click', (event) => {
        const btn = event.target.closest('button');
        if (!btn) return;
        state.quote = btn.dataset.quote;
        renderQuoteTabs();
        renderList();
      });

      document.getElementById('cautionOnly').addEventListener('change', (event) => {
        state.cautionOnly = event.target.checked;
        renderQuoteTabs();
        renderList();
      });

      document.getElementById('listHeader').addEventListener('click', (event) => {
        const btn = event.target.closest('button');
        if (!btn) return;
        const key = btn.dataset.sort;
        state.sort = state.sort.key === key ? { key, dir: -state.sort.dir } : { key, dir: key === 'name' ? 1 : -1 };
        renderList();
      });

      document.getElementById('coinList').addEventListener('click', (event) => {
        const row = event.target.closest('.coin-row');
        if (!row) return;
        state.market = row.dataset.market;
        state.hover = null;
        state.level = '0';
        history.replaceState(null, '', `#${state.market}`);
        renderList();
        renderDetail();
      });

      document.getElementById('detailTabs').addEventListener('click', (event) => {
        const btn = event.target.closest('button');
        if (!btn) return;
        state.tab = btn.dataset.tab;
        renderDetail();
      });

      document.getElementById('periodTabs').addEventListener('click', (event) => {
        const btn = event.target.closest('button');
        if (!btn) return;
        state.period = btn.dataset.period;
        state.hover = null;
        renderChart();
      });

      document.getElementById('levelSelect').addEventListener('change', (event) => {
        state.level = event.target.value;
        renderOrderbook();
      });

      document.getElementById('sideTabs').addEventListener('click', (event) => {
        const btn = event.target.closest('button');
        if (!btn) return;
        state.side = btn.dataset.side;
        renderTrades();
      });

      document.getElementById('apiToggle').addEventListener('change', (event) => {
        document.body.classList.toggle('show-api', event.target.checked);
      });

      let chartWidth = 0;
      new ResizeObserver(([entry]) => {
        const next = Math.round(entry.contentRect.width);
        if (next && next !== chartWidth && state.tab === 'chart') {
          chartWidth = next;
          renderChart();
        }
      }).observe(document.getElementById('chartWrap'));

      renderAll();
    </script>
  </body>
</html>
